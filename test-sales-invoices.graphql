# Test Sales Invoices - GraphQL Queries
# Copiar y pegar en GraphQL Playground (http://localhost:3000/graphql)

# ============================================
# 1. LOGIN (Ejecutar primero)
# ============================================
mutation Login {
  login(email: "admin@erp.com", password: "admin123") {
    access_token
    user {
      id
      email
      role
    }
  }
}

# ============================================
# 2. CREAR FACTURA DE VENTA
# ============================================
mutation CreateInvoice {
  createSalesInvoice(createSalesInvoiceInput: {
    customerId: 1
    invoiceDate: "2025-10-05T00:00:00.000Z"
    dueDate: "2025-11-04T00:00:00.000Z"
    currency: "USD"
    paymentTerms: "Net 30"
    notes: "Factura de prueba"
    items: [
      {
        productId: 1
        quantity: 10
        unitPrice: 100
        discount: 0
        taxRate: 0.16
      }
    ]
  }) {
    id
    invoiceNumber
    status
    paymentStatus
    subtotal
    taxAmount
    total
    outstandingAmount
  }
}

# ============================================
# 3. LISTAR FACTURAS
# ============================================
query ListInvoices {
  salesInvoices(skip: 0, take: 10) {
    id
    invoiceNumber
    invoiceDate
    status
    paymentStatus
    total
    paidAmount
    outstandingAmount
    customer {
      name
    }
  }
}

# ============================================
# 4. VER DETALLE DE FACTURA
# ============================================
query GetInvoice {
  salesInvoice(id: 1) {
    id
    invoiceNumber
    status
    paymentStatus
    total
    paidAmount
    outstandingAmount
    customer {
      name
      email
    }
    items {
      productName
      quantity
      unitPrice
      totalAmount
    }
    payments {
      amount
      paymentDate
      paymentMethod
    }
  }
}

# ============================================
# 5. ENVIAR FACTURA (DRAFT -> SUBMITTED)
# ============================================
mutation SubmitInvoice {
  submitSalesInvoice(id: 1) {
    id
    invoiceNumber
    status
  }
}

# ============================================
# 6. REGISTRAR PAGO
# ============================================
mutation RecordPayment {
  recordInvoicePayment(recordPaymentInput: {
    invoiceId: 1
    amount: 500
    paymentDate: "2025-10-05T00:00:00.000Z"
    paymentMethod: "BANK_TRANSFER"
    reference: "TRX-12345"
  }) {
    id
    amount
    paymentDate
    paymentMethod
  }
}

# ============================================
# 7. VER PAGOS DE FACTURA
# ============================================
query GetPayments {
  invoicePayments(invoiceId: 1) {
    id
    amount
    paymentDate
    paymentMethod
    reference
  }
}

# ============================================
# 8. CANCELAR FACTURA
# ============================================
mutation CancelInvoice {
  cancelSalesInvoice(id: 1) {
    id
    status
  }
}
