# SonarCloud Configuration

sonar.projectKey=sistema-erp
sonar.organization=tu-organizacion

# Metadata
sonar.projectName=Sistema ERP
sonar.projectVersion=1.0.0

# Source
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,backend/src/**/*.spec.ts,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/test/**,**/__tests__/**

# Coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

