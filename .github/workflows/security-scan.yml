name: Security Audit

on:
  schedule:
    # Escaneo semanal los domingos a las 2 AM
    - cron: '0 2 * * 0'
  workflow_dispatch: # Permite ejecución manual

jobs:
  security-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies - Frontend
        working-directory: ./frontend-next
        run: npm ci

      - name: Run npm audit - Frontend
        working-directory: ./frontend-next
        run: npm audit --audit-level=moderate || true

      - name: Install dependencies - Backend
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run safety check - Backend
        working-directory: ./backend
        run: |
          pip install safety || true
          safety check --file requirements.txt || true

      - name: Generate security report
        run: |
          echo "✅ Security audit completed" > security-report.md
          echo "Fecha: $(date)" >> security-report.md
          echo "" >> security-report.md
          echo "Check npm audit output above for details" >> security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-report.md
