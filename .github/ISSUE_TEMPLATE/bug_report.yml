name: 🐛 Bug Report
description: Reportar un error o comportamiento inesperado
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un bug. Por favor, completa la información a continuación.

  - type: textarea
    id: description
    attributes:
      label: Descripción del Bug
      description: Una descripción clara y concisa del bug
      placeholder: ¿Qué está fallando?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para Reproducir
      description: Pasos para reproducir el comportamiento
      placeholder: |
        1. Ve a '...'
        2. Haz clic en '...'
        3. Desplázate hasta '...'
        4. Observa el error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento Esperado
      description: Describe qué esperabas que sucediera
      placeholder: ¿Qué debería haber pasado?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento Actual
      description: Describe qué sucedió realmente
      placeholder: ¿Qué pasó en su lugar?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Componente Afectado
      description: ¿Qué parte del sistema está afectada?
      options:
        - Frontend
        - Backend (API)
        - Backend (GraphQL)
        - Base de Datos
        - Autenticación
        - Dashboard
        - Ventas
        - Compras
        - Productos
        - Motor IA
        - No estoy seguro
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      description: ¿Qué tan grave es el bug?
      options:
        - 🔴 Crítico - El sistema no funciona
        - 🟠 Alto - Funcionalidad importante afectada
        - 🟡 Medio - Afecta alguna funcionalidad
        - 🟢 Bajo - Problema menor o cosmético
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Capturas de Pantalla
      description: Si aplica, añade capturas de pantalla
      placeholder: Arrastra y suelta las imágenes aquí

  - type: textarea
    id: logs
    attributes:
      label: Logs/Errores de Consola
      description: Copia cualquier error de la consola
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Información sobre tu entorno
      placeholder: |
        - OS: [ej. Windows 11]
        - Navegador: [ej. Chrome 120]
        - Versión: [ej. commit hash o fecha]
      value: |
        - OS: 
        - Navegador: 
        - Versión: 
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Contexto Adicional
      description: Añade cualquier otra información relevante
      placeholder: ¿Algo más que debamos saber?

